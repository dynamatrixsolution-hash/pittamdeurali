name: Deploy Frontend and Backend to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json

    - name: Install client dependencies
      run: |
        cd client
        npm install --no-audit --no-fund

    - name: Build client
      run: |
        cd client
        npm run build

    - name: Upload frontend dist to VPS temporary directory
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        source: "client/dist/*"
        target: "/tmp/pittamdeurali-dist"
        overwrite: true

    - name: Upload server files to VPS temporary directory
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        source: "server"
        target: "/tmp/pittamdeurali-server"
        overwrite: true

    - name: Publish to web root and restart services
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        script: |
          # 1. Deploy Frontend
          mkdir -p /www/wwwroot/pittamdeurali
          rsync -av --delete \
            --exclude='.well-known' \
            --exclude='.git' \
            /tmp/pittamdeurali-dist/client/dist/ /www/wwwroot/pittamdeurali/
            
          # 2. Deploy Backend
          mkdir -p /www/wwwroot/pittamdeurali-server
          rsync -av --delete \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.git' \
            /tmp/pittamdeurali-server/server/ /www/wwwroot/pittamdeurali-server/
            
          # 3. Install backend dependencies and restart API
          cd /www/wwwroot/pittamdeurali-server
          npm install --production
          pm2 restart pittamdeurali-api || pm2 start server.js --name pittamdeurali-api
          pm2 save
